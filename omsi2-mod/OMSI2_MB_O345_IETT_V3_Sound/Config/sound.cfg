'----------------------------------------------
'  ENGINE SOUNDS
'----------------------------------------------

[sound]
'Engine Idle - OM447 Diesel at ~700 RPM
filename	Sound\engine\engine_idle.wav
is_3d	1
loop	1
volume	0.85
min_dist	2.0
max_dist	80.0
trigger	engine_idle

[sound]
'Engine Low RPM - ~1200 RPM cruising
filename	Sound\engine\engine_low_rpm.wav
is_3d	1
loop	1
volume	0.80
min_dist	2.0
max_dist	100.0
trigger	engine_low

[sound]
'Engine Mid RPM - ~1800 RPM acceleration
filename	Sound\engine\engine_mid_rpm.wav
is_3d	1
loop	1
volume	0.85
min_dist	2.0
max_dist	120.0
trigger	engine_mid

[sound]
'Engine High RPM - ~2200 RPM full power
filename	Sound\engine\engine_high_rpm.wav
is_3d	1
loop	1
volume	0.90
min_dist	3.0
max_dist	150.0
trigger	engine_high

[sound]
'Kickdown - Dramatic RPM rise with turbo spool
filename	Sound\engine\kickdown.wav
is_3d	1
loop	0
volume	0.95
min_dist	3.0
max_dist	150.0
trigger	kickdown

[sound]
'Turbo Blow-off / Wastegate
filename	Sound\engine\turbo_blowoff.wav
is_3d	1
loop	0
volume	0.70
min_dist	2.0
max_dist	60.0
trigger	turbo_blowoff

[sound]
'Engine Starter / Cranking
filename	Sound\engine\engine_starter.wav
is_3d	1
loop	0
volume	0.80
min_dist	2.0
max_dist	50.0
trigger	engine_start

