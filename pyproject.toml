[project]
name = "iett-tracking"
version = "1.0.0"
description = "Istanbul IETT Vehicle Tracking System with Live Maps"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
